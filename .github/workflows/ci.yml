name: CI

on:
  push:
    branches: [main]
    tags: ["v*", "V*", "Release*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 6.0.x

      - name: Publish web app
        shell: pwsh
        run: |
          dotnet publish EventAssembler/EventAssemblerWeb/EventAssemblerWeb.csproj -c Release -o artifacts/package/web
          Copy-Item README.md artifacts/package/

      - name: Package artifact
        shell: pwsh
        run: |
          $zip = "artifacts/EventAssembler-Web-${{ runner.os }}.zip"
          Compress-Archive -Path artifacts/package/* -DestinationPath $zip -Force

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: EventAssembler-Web-${{ runner.os }}
          path: artifacts/EventAssembler-Web-${{ runner.os }}.zip
          if-no-files-found: error

  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
